// The Velvet Vault — game/index.html: page shell. A full-window canvas, a
// screen-reader status line, and one module script. No network request: the
// only script is a file under game/.
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Velvet Vault — a midnight heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e18; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Velvet Vault: sneak past guards and cameras, steal the loot, and reach the getaway door"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
